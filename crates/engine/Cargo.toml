[package]
name = "engine"
description = "Deterministic falling-block simulation. No I/O, no time, no async, no floats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[features]
default = ["std", "serde"]
std = ["serde?/std"]
# Serialization needs alloc: config uses internally tagged enums so that mode files can
# say `type = "fixed"`, and serde buffers those during deserialization. The engine core
# stays no_std and allocation-free; only the serde layer adds that requirement.
serde = ["dep:serde", "serde/alloc", "arrayvec/serde", "bitflags/serde"]

[dependencies]
arrayvec.workspace = true
bitflags.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
