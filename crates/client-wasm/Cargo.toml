[package]
name = "client-wasm"
description = "Browser bindings over the simulation: one call to advance it, one block to read it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
replay = { path = "../replay" }
config = { path = "../config", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"
