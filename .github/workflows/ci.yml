name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (debug)
        run: cargo test --workspace

      # Release is not a redundant run. Overflow and shift semantics differ between
      # profiles, and a rule that behaves differently in release is a desync waiting
      # to happen between a release client and a differently-built server.
      - name: Test (release)
        run: cargo test --workspace --release

      # Proves the engine stays usable by no_std consumers such as bots and solvers.
      - name: Build engine without default features
        run: cargo build -p engine --no-default-features

      # The client shares this crate's settings validation. Without file loading it must
      # not pull a TOML parser into the browser bundle.
      - name: Build config without file loading
        run: cargo build -p config --no-default-features

      - name: Build engine for wasm32
        run: |
          cargo build -p engine --target wasm32-unknown-unknown
          cargo build -p engine --target wasm32-unknown-unknown --no-default-features

      # The check the whole networked design rests on. A client runs the simulation in a
      # browser and a server runs it natively, so a difference between the two is two
      # peers disagreeing about a game in progress.
      - name: Native and wasm produce identical results
        run: ./scripts/wasm-parity.sh

      # The engine matching across targets is not the same claim as the client matching.
      # This one covers the artifact a player loads: bindings, frame block and all.
      - name: The built client reproduces recorded games
        run: |
          cargo install wasm-pack --locked --version 0.15.0
          ./scripts/client-parity.sh

      - name: Engine purity guard
        run: ./scripts/engine-purity.sh

      # The client builds its settings screen from this file, so it must not fall
      # behind the descriptor tables it is generated from.
      - name: Settings schema is current
        run: cargo run -q -p config --bin emit-schema -- --check

      - name: Docs build without broken links
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: cargo install wasm-pack --locked --version 0.15.0
      - run: pnpm install --frozen-lockfile

      # The bindings are generated, so typechecking without them proves nothing.
      - name: Build the wasm module
        run: pnpm --dir apps/web run wasm

      - name: Typecheck
        run: pnpm --dir apps/web run typecheck

      - name: Client tests
        run: pnpm --dir apps/web test
