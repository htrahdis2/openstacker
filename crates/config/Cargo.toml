[package]
name = "config"
description = "Reads game modes and player settings, and emits the settings schema."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[features]
default = ["files"]
# Reading mode files from disk. Off leaves settings, resolution and schema emission,
# which is all a browser build needs and none of which touches the filesystem.
files = ["dep:toml", "dep:thiserror"]

# Emitting the modes means reading them, so this binary needs the file half of the crate.
[[bin]]
name = "emit-modes"
path = "src/bin/emit-modes.rs"
required-features = ["files"]

[dependencies]
engine = { path = "../engine" }
serde = { workspace = true, features = ["std"] }
serde_json = "1"
toml = { version = "0.9", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
toml = "0.9"
