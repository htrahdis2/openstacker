spec_version = 1
id           = "versus"
name         = "Versus"
description  = "Send rows to your opponent and outlast them."

[goal]
type = "survival"

[config]
lock_delay_ms       = 500
lock_reset_mode     = "extended"
lock_reset_cap      = 15
preview_len         = 5
spin_detection      = "three_corner"
b2b_table           = [0, 1, 1, 1, 2, 2, 2, 3, 3, 4]
garbage_delay_ms    = 1000
garbage_cap         = 8
garbage_hole_repeat = true

[config.gravity]
type       = "fixed"
ms_per_row = 1000

[config.attack_table]
single           = 0
double           = 1
triple           = 2
quad             = 4
mini_spin_single = 0
mini_spin_double = 1
spin_single      = 2
spin_double      = 4
spin_triple      = 6
perfect_clear    = 10

# The training opponent, for playing versus with nobody on the other side. Not a rule of
# the game: it produces garbage, and garbage is recorded in the replay like any other.
[sparring]
first_batch_ms   = 8000
interval_ms      = 6000
interval_step_ms = 250
min_interval_ms  = 1500
rows_min         = 1
rows_max         = 4
