spec_version = 1
id           = "versus_classic"
name         = "Versus (classic)"
description  = "Versus with a flat back-to-back bonus and a gentler opponent."

[goal]
type = "survival"

# The M0 proposal, kept as something to tune against. Back-to-back pays the same however
# long the chain, which is the thing versus.toml changed, so playing the two next to each
# other is the quickest way to feel what escalation is worth.
[config]
lock_delay_ms       = 500
lock_reset_mode     = "extended"
lock_reset_cap      = 15
preview_len         = 5
spin_detection      = "three_corner"
b2b_table           = [0, 1]
garbage_delay_ms    = 1200
garbage_cap         = 8
garbage_hole_repeat = true

[config.gravity]
type       = "fixed"
ms_per_row = 1000

[config.attack_table]
single           = 0
double           = 1
triple           = 2
quad             = 4
mini_spin_single = 0
mini_spin_double = 1
spin_single      = 2
spin_double      = 4
spin_triple      = 6
spin_quad        = 8
perfect_clear    = 10

[sparring]
first_batch_ms   = 12000
interval_ms      = 8000
interval_step_ms = 200
min_interval_ms  = 2500
rows_min         = 1
rows_max         = 3
