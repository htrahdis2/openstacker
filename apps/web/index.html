<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>openstacker</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <aside class="rail rail-left">
        <section class="box">
          <h2>hold</h2>
          <canvas id="hold"></canvas>
        </section>
        <dl id="stats">
          <dt>time</dt><dd id="stat-time">0:00.00</dd>
          <dt>lines</dt><dd id="stat-lines">0</dd>
          <dt>pieces</dt><dd id="stat-pieces">0</dd>
          <dt>pps</dt><dd id="stat-pps">0.00</dd>
        </dl>
      </aside>

      <section class="stage">
        <div class="garbage" id="garbage-track"><div class="garbage-fill" id="garbage"></div></div>
        <div class="board-wrap">
          <canvas id="board"></canvas>
          <div id="overlay" class="overlay">
            <div class="card">
              <h1 id="overlay-title">openstacker</h1>
              <p id="overlay-note" class="note"></p>
              <ul id="mode-list" class="modes"></ul>
              <dl id="result" class="result" hidden></dl>
              <div class="actions">
                <button id="again" type="button" hidden>play again</button>
                <button id="back" type="button" hidden>change mode</button>
                <button id="open-settings" type="button">settings</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="rail">
        <section class="box">
          <h2>next</h2>
          <canvas id="next"></canvas>
        </section>
        <section class="box">
          <h2 id="goal-label">goal</h2>
          <p id="goal-value" class="goal">—</p>
        </section>
      </aside>
    </main>

    <div id="settings-screen" class="screen" hidden>
      <header class="screen-head">
        <h1>settings</h1>
        <button id="close-settings" type="button">done</button>
      </header>
      <p id="settings-notes" class="notes" hidden></p>
      <div id="settings-panel" class="settings-panel"></div>
    </div>

    <p id="status" class="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
